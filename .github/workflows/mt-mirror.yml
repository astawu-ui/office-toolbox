          echo "共 $n 个文件，核对全部通过"
          rm list.txt
      - name: 上传到 mt-v1 发布（不会被标成最新版本）
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          cd mt
          gh release view mt-v1 >/dev/null 2>&1 || gh release create mt-v1 --prerelease --latest=false --title "离线翻译语言包（不是软件版本）" --notes "办公百宝箱「文件翻译 → 离线翻译」用的语言包，软件会按需自动下载，不需要手动下载。语言包来自 Mozilla Firefox Translations，许可证 MPL-2.0（https://mozilla.org/MPL/2.0/）。"
          gh release upload mt-v1 *.zst --clobber
          echo "完成"
